name: Git Flow Check

on:
  pull_request:
    branches: [master]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source is develop
        run: |
          BRANCH="${{ github.head_ref }}"
          if [ "$BRANCH" != "develop" ]; then
            echo "::error::master branch'ine sadece develop'tan merge edilebilir. Bu PR'in source branch'i: $BRANCH"
            exit 1
          fi
          echo "OK: develop -> master"
